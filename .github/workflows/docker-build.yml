name: CloudShip Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloudship:test .

      - name: Run container
        run: docker run -d --name cloudship-test -p 3000:3000 cloudship:test

      - name: Verify health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs cloudship-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f cloudship-test || true
