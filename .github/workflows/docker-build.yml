
name: CloudShip Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit


      - name: Build Docker image
        run: docker build -t cloudship:test .

      - name: Run container
        run: docker run -d --name cloudship-test -p 3000:3000 cloudship:test

      - name: Verify health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs cloudship-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f cloudship-test || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag cloudship:test "$IMAGE_ID:latest"
          docker tag cloudship:test "$IMAGE_ID:${GITHUB_SHA::7}"
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:${GITHUB_SHA::7}"
